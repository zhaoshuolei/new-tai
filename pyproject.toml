[project]
name = "tianxiadmin"
version = "0.1.0"
description = "Tianxiadmin user and permission management backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy",
    "cryptography",
    "alembic",
    "redis",
    "pydantic>=2",
    "pydantic-settings",
    "pyjwt",
    "argon2-cffi",
    "httpx",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
    "types-psutil>=7.2.2.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
