default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy-project
        name: mypy (project environment)
        entry: .venv/bin/mypy app
        language: system
        pass_filenames: false
        files: ^app/
